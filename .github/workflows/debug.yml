name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - v2

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
            -o /tmp/cmdline-tools.zip

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest" \
                 "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools"

          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"

          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          elif [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            echo "cmdline-tools already extracted"
          else
            echo "Unexpected cmdline-tools layout"
            ls -R "$ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Download bundled libretro cores
        env:
          BUILDBOT: https://buildbot.libretro.com/nightly/android/latest
          CORES: >-
            gambatte genesis_plus_gx handy mednafen_ngp mednafen_pce_fast
            mednafen_vb mednafen_wswan mgba nestopia pcsx_rearmed pokemini
            prosystem snes9x stella swanstation
        run: |
          for arch in arm64-v8a armeabi-v7a; do
            dir="app/src/main/jniLibs/${arch}"
            mkdir -p "$dir"
            for core in $CORES; do
              name="${core}_libretro_android.so"
              echo "Downloading ${arch}/${name}"
              curl -fL "${BUILDBOT}/${arch}/${name}.zip" -o /tmp/core.zip
              unzip -o -q /tmp/core.zip -d "$dir"
              rm -f /tmp/core.zip
            done
          done

      - name: Fetch RetroArch autoconfig cfgs
        run: |
          chmod +x scripts/fetch-autoconfig.sh
          ./scripts/fetch-autoconfig.sh

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cannoli-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
